version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: phantom-bot-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: phantom_user
            POSTGRES_PASSWORD: phantom_password
            POSTGRES_DB: phantom_bot
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U phantom_user -d phantom_bot"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
        driver: local
