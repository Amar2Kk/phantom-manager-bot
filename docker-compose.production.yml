version: "3.8"

services:
    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: phantom-manager-bot
        restart: unless-stopped
        environment:
            - DISCORD_TOKEN=${DISCORD_TOKEN}
            - CLIENT_ID=${CLIENT_ID}
            - DATABASE_URL=${DATABASE_URL}
            - NODE_ENV=production
        depends_on:
            - db
        networks:
            - bot-network

    db:
        image: postgres:16-alpine
        container_name: phantom-bot-db
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB:-phantom_bot}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        networks:
            - bot-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres-data:
        driver: local

networks:
    bot-network:
        driver: bridge
